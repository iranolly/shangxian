[package]
name = "shangxian-cli"
version = "0.6.1"
description = "上线助手命令行：给 AI agent 和其他程序查询、配置用"
edition = "2021"

[[bin]]
name = "cli"
path = "src/main.rs"

[dependencies]
shangxian-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
