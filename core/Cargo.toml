[package]
name = "shangxian-core"
version = "0.6.1"
description = "上线助手核心：SSH 隧道进程看护（不依赖界面）"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# 本地生成 nginx 访问密码的 bcrypt 哈希（明文密码不再上服务器、不进 ssh 命令行）
bcrypt = "0.19"
# 只用来做「密码登录一次 → 配好免密」这一步；隧道本身仍走系统 ssh.exe
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # proc_probe.rs 用：NtQueryInformationProcess 类 0/26/60
    "Wdk_System_Threading",
] }
